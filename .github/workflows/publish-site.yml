# Render geo_site.qmd and publish it to GitHub Pages.
#
# - Push to main: render the page and push the HTML to the gh-pages branch,
#   which GitHub Pages serves at https://pltu06.github.io/geocoding/
# - Pull request: render only, so a broken page shows up before merging
# - "Run workflow" button (Actions tab): render and publish on demand
#
# Building the page downloads the public index data, Census boundary files for
# the example states, and runs the opt-in Census geocoder example on the ten
# public state capitols. No participant data is involved.

name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "geo_site.qmd"
      - "src/**"
      - "Data/**"
      - ".github/workflows/publish-site.yml"
  pull_request:
    paths:
      - "geo_site.qmd"
      - "src/**"
      - "Data/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

# Needed to push the rendered page to the gh-pages branch
permissions:
  contents: write

# Don't let two publishes race each other
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # prebuilt Linux packages, much faster installs

      # Packages the page uses. setup-r-dependencies also installs the system
      # libraries sf needs (GDAL, GEOS, PROJ). censusxy isn't on CRAN.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::DT
            any::dplyr
            any::readr
            any::stringr
            any::tidyr
            any::tidyselect
            any::tibble
            any::sf
            any::tigris
            github::chris-prener/censusxy

      - name: Render (pull requests)
        if: github.event_name == 'pull_request'
        run: quarto render geo_site.qmd

      - name: Render and publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898733+github-actions[bot]@users.noreply.github.com"
          quarto publish gh-pages geo_site.qmd --no-browser --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
